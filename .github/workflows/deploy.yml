name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # NOTE: do not bother raising the deploy timeout. It is capped.
    #
    # actions/deploy-pages accepts a `timeout` input, and GitHub silently
    # clamps it: passing 1500000 logs "timeout value is greater than the
    # allowed maximum - timeout set to the maximum of 600000 milliseconds" and
    # carries on with ten minutes. So when Pages is slow there is no lever here
    # at all, and a failed run is a failed run.
    #
    # Worth knowing what that looks like, because it wasted an afternoon:
    # deploys for this repo ran in 12 seconds on 1-4 Aug, then degraded through
    # 6 Aug to 1.6, 3.8, 4.3, 6.0, 8.4 minutes and finally past the cap. Every
    # other stage stayed green the whole time, dist grew only 300 to 394 KB
    # across the stretch that went from 0.2 to 8.4 minutes, and no incident was
    # posted until well after. If deploys start timing out and the build is
    # green, check the deployment durations before changing anything:
    #
    #   for id in $(gh api repos/OWNER/REPO/deployments --jq '.[].id'); do
    #     gh api repos/OWNER/REPO/deployments/$id/statuses --jq '.[].state'
    #   done
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
