# Build, test, and publish to Cloudflare Pages.
#
# This used to deploy to GitHub Pages. On 6 Aug that pipeline stopped working:
# every run built and tested green, uploaded its artifact, created the
# deployment, and then sat in GitHub's processing stage until it hit the
# ten-minute cap, which actions/deploy-pages will not let you raise (passing a
# larger `timeout` logs "timeout value is greater than the allowed maximum" and
# uses 600000 anyway). Six runs in a row died that way with nothing wrong on
# our side. Every other repo on this account deploys fine because none of them
# were on GitHub Pages.
#
# vite.config.ts already reads CF_PAGES to pick the base path ('/' on
# Cloudflare, '/card-game/' on a GitHub project site), so it is set here to get
# root-relative asset URLs.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tests gate the deploy: a red suite must never reach the live site.
      - run: npm test
      - run: npm run build
        env:
          CF_PAGES: '1'
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name kurukshetra --branch main
