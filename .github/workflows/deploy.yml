name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages has been slow for this repo for a while and we were living on the
    # margin without knowing it. Successful deploys took 6 min and then 8.5 min
    # against the action's 10-minute default; the art tipped it over and three
    # runs in a row died at exactly 600 seconds.
    #
    # The timeout MUST be quoted. The action declares its own default as the
    # string '600000', so an unquoted YAML integer is not what it expects, and
    # a run carrying `timeout: 1200000` still aborted at exactly ten minutes,
    # having silently fallen back to the default.
    timeout-minutes: 30
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: '1500000' # 25 minutes
